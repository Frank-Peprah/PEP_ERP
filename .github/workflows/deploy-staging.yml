# Deploy the API to the Supabase staging project (Blueprint 11 §3).
# Bundles apps/api into supabase/functions/pep-api and deploys it with the Supabase CLI, server-side
# bundling (--use-api, no Docker). The code is uploaded from this workflow, so the deployment no
# longer depends on the repository being public (prerequisite for decision D2: private repo).
#
# Needs repository secret SUPABASE_ACCESS_TOKEN (a personal access token from
# supabase.com/dashboard/account/tokens). Without it the job explains what is missing and stops.
# Database migrations are still applied with review (Phase 0 remainder: move to supabase/migrations).
name: Deploy API to staging

on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'packages/**'
      - 'supabase/functions/**'
      - 'scripts/build-edge.mjs'
      - 'package-lock.json'
      - '.github/workflows/deploy-staging.yml'
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read

env:
  PROJECT_REF: ppyancjjjsaogyjpkxcr
  API_URL: https://ppyancjjjsaogyjpkxcr.supabase.co/functions/v1/pep-api

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    steps:
      - name: Check deploy credentials
        id: creds
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN is not set; skipping deploy. Add it under Settings → Secrets and variables → Actions."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.creds.outputs.ok == 'true'
      - uses: actions/setup-node@v4
        if: steps.creds.outputs.ok == 'true'
        with:
          node-version: 22
          cache: npm
      - if: steps.creds.outputs.ok == 'true'
        run: npm ci
      - name: Bundle the API for Deno
        if: steps.creds.outputs.ok == 'true'
        run: node scripts/build-edge.mjs
      - name: Deploy pep-api
        if: steps.creds.outputs.ok == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: npx --yes supabase@2.122.0 functions deploy pep-api --project-ref "$PROJECT_REF" --no-verify-jwt --use-api
      - name: Smoke test (health; a forged token must be refused)
        if: steps.creds.outputs.ok == 'true'
        run: |
          for i in $(seq 1 20); do curl -sf "$API_URL/api/health" && break; sleep 3; done
          curl -sf "$API_URL/api/health" | grep -q '"ok":true'
          code=$(curl -s -o /dev/null -w '%{http_code}' -H 'authorization: Bearer a.b.c' "$API_URL/api/me")
          test "$code" = "401" || { echo "expected 401 for a forged token, got $code"; exit 1; }
          echo "staging API healthy; forged token refused"
