# Builds the React web app and publishes it to GitHub Pages at https://<owner>.github.io/<repo>/
#
# Works with either Pages source setting:
#  - "Deploy from a branch" (main, /root): the built app is committed to app/ with a root
#    index.html redirect, so GitHub's branch build publishes the app (not the README).
#  - "GitHub Actions": the deploy job publishes the same layout from _site/.
# The API stays on Supabase; the app calls it directly (VITE_API_BASE in scripts/build-pages.sh).
name: Deploy web app to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/build-pages.sh'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build app for Pages
        run: ./scripts/build-pages.sh
      - name: Commit rebuilt app/ to main (branch-mode Pages)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app
          if git diff --cached --quiet; then
            echo "app/ unchanged"
          else
            git commit -m "chore(pages): rebuild app/ from ${GITHUB_SHA::7}"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
